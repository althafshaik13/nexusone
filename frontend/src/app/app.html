<div class="app-shell">
  <header class="app-header">
    <span class="brand">NexusOne</span>
    <nav>
      <a routerLink="/tickets" routerLinkActive="active">Tickets</a>
      <a routerLink="/profile" routerLinkActive="active">My Profile</a>
      <a routerLink="/requests" routerLinkActive="active">My Requests</a>
      <a routerLink="/approvals" routerLinkActive="active">Approvals</a>
      @if (auth.hasRole('ADMIN')) {
        <a routerLink="/admin/organizations" routerLinkActive="active">Admin</a>
        <a routerLink="/admin/analytics" routerLinkActive="active">Analytics</a>
      }
    </nav>
    <div class="spacer"></div>
    @if (auth.authenticated()) {
      <span class="user">{{ auth.username() }}</span>
      <button type="button" class="logout" (click)="auth.logout()">Log out</button>
    }
  </header>

  <main class="app-content">
    <router-outlet />
  </main>
</div>
