<a routerLink="/admin/organizations" class="back-link">&larr; Back to organizations</a>

<section class="organization-create">
  <h2>New organization</h2>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Name
      <input type="text" formControlName="name" placeholder="Organization name" />
    </label>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <button type="submit" [disabled]="form.invalid || submitting()">
      {{ submitting() ? 'Creating…' : 'Create organization' }}
    </button>
  </form>
</section>
