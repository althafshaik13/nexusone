spring.application.name=ai-copilot-service

server.port=${SERVER_PORT:8086}

nexusone.security.jwk-set-uri=${JWK_SET_URI:http://localhost:8081/realms/nexusone/protocol/openid-connect/certs}
nexusone.security.expected-issuer=${EXPECTED_ISSUER:http://localhost:8081/realms/nexusone}

nexusone.ticket-service.base-url=${TICKET_SERVICE_URL:http://localhost:8082}

nexusone.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
nexusone.ai.ollama.model=${OLLAMA_MODEL:llama3.2:3b}
nexusone.ai.ollama.read-timeout-seconds=${OLLAMA_READ_TIMEOUT_SECONDS:120}

eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
