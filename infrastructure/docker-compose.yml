services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: nexusone
      POSTGRES_PASSWORD: nexusone
      POSTGRES_DB: nexusone
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusone -d nexusone"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"

  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  discovery-server:
    build:
      context: ../discovery-server
    ports:
      - "8761:8761"

  ticket-service:
    build:
      context: ../ticket-service
    environment:
      DB_HOST: postgres
      JWK_SET_URI: http://keycloak:8080/realms/nexusone/protocol/openid-connect/certs
      EXPECTED_ISSUER: http://localhost:8081/realms/nexusone
      KAFKA_BOOTSTRAP: kafka:29092
      EUREKA_URI: http://discovery-server:8761/eureka
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      discovery-server:
        condition: service_started

  gateway:
    build:
      context: ../gateway
    environment:
      EUREKA_URI: http://discovery-server:8761/eureka
      REDIS_HOST: redis
    ports:
      - "8080:8080"
    depends_on:
      - ticket-service
      - discovery-server
      - redis

  notification-service:
    build:
      context: ../notification-service
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      MONGO_HOST: mongodb
      SMTP_HOST: mailpit
      RABBIT_HOST: rabbitmq
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_started
      mongodb:
        condition: service_started
      mailpit:
        condition: service_started
      rabbitmq:
        condition: service_started

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  keycloak_data:
  mongodata:
