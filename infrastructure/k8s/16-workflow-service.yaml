apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-service
  namespace: nexusone
spec:
  replicas: 1
  selector:
    matchLabels: { app: workflow-service }
  template:
    metadata:
      labels: { app: workflow-service }
    spec:
      containers:
        - name: workflow-service
          image: nexusone/workflow-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
          env:
            - name: DB_HOST
              value: postgres
            - name: EUREKA_URI
              value: http://discovery-server:8761/eureka
            - name: JWK_SET_URI
              value: http://keycloak:8080/realms/nexusone/protocol/openid-connect/certs
            - name: EXPECTED_ISSUER
              value: http://localhost:8081/realms/nexusone
            - name: ORGANIZATION_SERVICE_URL
              value: http://organization-service:8084
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: workflow-service
  namespace: nexusone
spec:
  selector: { app: workflow-service }
  ports:
    - port: 8085
      targetPort: 8085
