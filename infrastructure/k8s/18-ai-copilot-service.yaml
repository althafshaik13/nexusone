apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-copilot-service
  namespace: nexusone
spec:
  replicas: 1
  selector:
    matchLabels: { app: ai-copilot-service }
  template:
    metadata:
      labels: { app: ai-copilot-service }
    spec:
      containers:
        - name: ai-copilot-service
          image: nexusone/ai-copilot-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8086
          env:
            - name: EUREKA_URI
              value: http://discovery-server:8761/eureka
            - name: JWK_SET_URI
              value: http://keycloak:8080/realms/nexusone/protocol/openid-connect/certs
            - name: EXPECTED_ISSUER
              value: http://localhost:8081/realms/nexusone
            - name: TICKET_SERVICE_URL
              value: http://ticket-service:8082
            - name: OLLAMA_BASE_URL
              value: http://ollama:11434
            - name: OLLAMA_MODEL
              value: "llama3.2:3b"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-copilot-service
  namespace: nexusone
spec:
  selector: { app: ai-copilot-service }
  ports:
    - port: 8086
      targetPort: 8086
