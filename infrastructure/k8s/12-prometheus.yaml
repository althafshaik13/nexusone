apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: nexusone
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: gateway
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['gateway:8080']
      - job_name: ticket-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['ticket-service:8082']
      - job_name: notification-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['notification-service:8083']
      - job_name: discovery-server
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['discovery-server:8761']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: nexusone
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: nexusone
spec:
  selector: { app: prometheus }
  ports:
    - port: 9090
      targetPort: 9090
