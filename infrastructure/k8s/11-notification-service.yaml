apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: nexusone
spec:
  replicas: 1
  selector:
    matchLabels: { app: notification-service }
  template:
    metadata:
      labels: { app: notification-service }
    spec:
      containers:
        - name: notification-service
          image: nexusone/notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: KAFKA_BOOTSTRAP
              value: kafka:9092
            - name: MONGO_HOST
              value: mongodb
            - name: SMTP_HOST
              value: mailpit
            - name: RABBIT_HOST
              value: rabbitmq
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: nexusone
spec:
  selector: { app: notification-service }
  ports:
    - port: 8083
      targetPort: 8083
