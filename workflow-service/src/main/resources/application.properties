spring.application.name=workflow-service

server.port=${SERVER_PORT:8085}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/nexusone_workflow
spring.datasource.username=nexusone
spring.datasource.password=nexusone

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

nexusone.security.jwk-set-uri=${JWK_SET_URI:http://localhost:8081/realms/nexusone/protocol/openid-connect/certs}
nexusone.security.expected-issuer=${EXPECTED_ISSUER:http://localhost:8081/realms/nexusone}

nexusone.organization-service.base-url=${ORGANIZATION_SERVICE_URL:http://localhost:8084}

management.endpoints.web.exposure.include=health,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
