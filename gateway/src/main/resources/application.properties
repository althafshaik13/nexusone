spring.application.name=gateway

server.port=${SERVER_PORT:8080}

eureka.client.enabled=true
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.server.webmvc.routes[0].id=ticket-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://ticket-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/tickets/**,/api/users/**

spring.cloud.gateway.server.webmvc.routes[1].id=organization-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://organization-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/organizations/**,/api/departments/**,/api/teams/**,/api/employees/**

spring.cloud.gateway.server.webmvc.routes[2].id=workflow-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://workflow-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/workflow-definitions/**,/api/workflow-instances/**

spring.cloud.gateway.server.webmvc.routes[3].id=ai-copilot-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://ai-copilot-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/copilot/**

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379

nexusone.ratelimit.window-seconds=60
nexusone.ratelimit.max-requests=20

management.endpoints.web.exposure.include=health,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
